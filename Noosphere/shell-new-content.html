.ns-col-deep{width:280px;display:none;border-right:1px solid var(--ns-border)}
.ns-col-deep.is-visible{display:block}

function renderUniverseThreeCols(data){

      realmBtns.forEach(function(b){b.classList.remove("is-active");});
      btn.classList.add("is-active");
      colSec.innerHTML="";
      colPages.innerHTML="";
      colPages.classList.remove("is-visible");
      var secBtns=[];
      realm.sections.forEach(function(sec){
        var sb=document.createElement("button");sb.type="button";sb.className="ns-folder-btn";
        sb.textContent=sec.name;
        secBtns.push(sb);
        function pickSec(){
          secBtns.forEach(function(x){x.classList.remove("is-active");});
          sb.classList.add("is-active");
          colPages.innerHTML="";

function renderSB(data){
  if(data.realms&&data.realms.length){
    renderUniverseThreeCols(data);
    return;
  }
  var aside=document.getElementById("ns-aside");if(!aside)return;aside.innerHTML="";
  var col1=document.createElement("div");col1.className="ns-col";
  var col2=document.createElement("div");col2.className="ns-col ns-col-sub";
  /* Highlights */
  (data.highlights||[]).forEach(function(h){
    var btn=document.createElement("button");btn.type="button";btn.className="ns-highlight";btn.textContent=h.l;
    btn.addEventListener("click",function(){spaNav(h.p);closeSB();});
    col1.appendChild(btn);
  });
  var folders=data.folders||[];
  if(folders.length){var sep=document.createElement("div");sep.className="ns-sep";col1.appendChild(sep);}
  /* Folders (Wargame) */
  var folderBtns=[];
  folders.forEach(function(f,idx){
    var btn=document.createElement("button");btn.type="button";btn.className="ns-folder-btn";
    btn.textContent=f.name;

      btn.classList.add("is-active");
      col2.innerHTML="";
      var title=document.createElement("div");title.className="ns-sub-title";title.textContent=f.name;
      col2.appendChild(title);
      f.items.forEach(function(it){

        link.addEventListener("click",function(){spaNav(it.p);closeSB();});

    btn.addEventListener("mouseenter",showSub);
    btn.addEventListener("click",showSub);
    col1.appendChild(btn);
  });
  aside.appendChild(col1);aside.appendChild(col2);
}
