    }

function renderUniverseThreeCols(data){
  var aside=document.getElementById("ns-aside");if(!aside)return;aside.innerHTML="";
  var colMain=document.createElement("div");colMain.className="ns-col";
  var colSec=document.createElement("div");colSec.className="ns-col ns-col-sub";
  var colPages=document.createElement("div");colPages.className="ns-col ns-col-sub ns-col-deep";

  data.highlights.forEach(function(h){
    var btn=document.createElement("button");btn.type="button";btn.className="ns-highlight";btn.textContent=h.l;
    btn.addEventListener("click",function(){spaNav(h.p);closeSB();});
    colMain.appendChild(btn);
  });
  if(data.realms&&data.realms.length){var sep=document.createElement("div");sep.className="ns-sep";colMain.appendChild(sep);var hubLbl=document.createElement("div");hubLbl.className="ns-sub-title";hubLbl.textContent="Noosphera";colMain.appendChild(hubLbl);}

  var realmBtns=[];
  data.realms.forEach(function(realm){
    var btn=document.createElement("button");btn.type="button";btn.className="ns-folder-btn";
    btn.textContent=realm.name;
    realmBtns.push(btn);
    function pickRealm(){
      realmBtns.forEach(function(b){b.classList.remove("is-active");});
      btn.classList.add("is-active");
      colSec.innerHTML="";
      colPages.innerHTML="";
      colPages.classList.remove("is-visible");
      var secBtns=[];
      realm.sections.forEach(function(sec){
        var sb=document.createElement("button");sb.type="button";sb.className="ns-folder-btn";
        sb.textContent=sec.name;
        secBtns.push(sb);
        function pickSec(){
          secBtns.forEach(function(x){x.classList.remove("is-active");});
          sb.classList.add("is-active");
          colPages.innerHTML="";
          var title=document.createElement("div");title.className="ns-sub-title";title.textContent=realm.name+" › "+sec.name;
          colPages.appendChild(title);
          sec.items.forEach(function(it){
            var link=document.createElement("button");link.type="button";link.className="ns-sub-link";link.textContent=it.l;
            link.addEventListener("click",function(){spaNav(it.p);closeSB();});
            colPages.appendChild(link);
          });
          colPages.classList.add("is-visible");
        }
        sb.addEventListener("mouseenter",pickSec);
        sb.addEventListener("click",pickSec);
        colSec.appendChild(sb);
      });
      colSec.classList.add("is-visible");
    }
    btn.addEventListener("mouseenter",pickRealm);
    btn.addEventListener("click",pickRealm);
    colMain.appendChild(btn);
  });
  aside.appendChild(colMain);aside.appendChild(colSec);aside.appendChild(colPages);
}

function renderSB(data){
  if(data.realms&&data.realms.length){
    renderUniverseThreeCols(data);
    return;
  }
  var aside=document.getElementById("ns-aside");if(!aside)return;aside.innerHTML="";
  var col1=document.createElement("div");col1.className="ns-col";
  var col2=document.createElement("div");col2.className="ns-col ns-col-sub";
  /* Highlights */
  (data.highlights||[]).forEach(function(h){
    var btn=document.createElement("button");btn.type="button";btn.className="ns-highlight";btn.textContent=h.l;
    btn.addEventListener("click",function(){spaNav(h.p);closeSB();});
    col1.appendChild(btn);
  });
  var folders=data.folders||[];
  if(folders.length){var sep=document.createElement("div");sep.className="ns-sep";col1.appendChild(sep);}
  /* Folders (Wargame) */
  var folderBtns=[];
  folders.forEach(function(f,idx){
    var btn=document.createElement("button");btn.type="button";btn.className="ns-folder-btn";
    btn.textContent=f.name;
    folderBtns.push(btn);
    function showSub(){
      folderBtns.forEach(function(b){b.classList.remove("is-active");});
      btn.classList.add("is-active");
      col2.innerHTML="";
      var title=document.createElement("div");title.className="ns-sub-title";title.textContent=f.name;
      col2.appendChild(title);
      f.items.forEach(function(it){
        var link=document.createElement("button");link.type="button";link.className="ns-sub-link";link.textContent=it.l;
        link.addEventListener("click",function(){spaNav(it.p);closeSB();});
        col2.appendChild(link);
      });
      col2.classList.add("is-visible");
    }
    btn.addEventListener("mouseenter",showSub);
    btn.addEventListener("click",showSub);
    col1.appendChild(btn);
  });
  aside.appendChild(col1);aside.appendChild(col2);
}
